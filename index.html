<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌌 El universo que te esperaba</title>

<style>

/* =========================
   UNIVERSO SUAVE VIVO
========================= */

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
background: radial-gradient(circle at top,#0b1020,#050816,#02030a);
}

/* canvas universo */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* =========================
   UI PRINCIPAL
========================= */

.ui{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
z-index:10;
}

h1{
font-size:3rem;
font-weight:500;
text-shadow:0 0 20px rgba(255,255,255,0.2);
}

p{
max-width:600px;
opacity:.75;
line-height:1.6;
}

/* =========================
   BOTONES SUAVES
========================= */

button{
margin-top:15px;
padding:12px 20px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.05);
color:white;
cursor:pointer;
backdrop-filter:blur(10px);
transition:.3s;
}

button:hover{
transform:translateY(-3px);
background:rgba(255,255,255,0.1);
}

/* =========================
   PANEL DE TEXTO
========================= */

.panel{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:12px 18px;
border-radius:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
display:none;
max-width:80%;
text-align:center;
}

</style>

</head>

<body>

<canvas id="space"></canvas>

<div class="ui" id="ui">

<h1>🌌 Conectando universo...</h1>

<p id="text">
No sé quién eres todavía…<br>
pero siento que ya te estaba esperando.
</p>

<button onclick="start()">✨ Continuar</button>

</div>

<div class="panel" id="panel"></div>

<script>

/* =========================
   UNIVERSO VIVO (CANVAS)
========================= */

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let stars = [];

for(let i=0;i<120;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
dx:(Math.random()-0.5)*0.3,
dy:(Math.random()-0.5)*0.3
});
}

function draw(){

ctx.fillStyle="rgba(5,8,20,0.4)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

s.x+=s.dx;
s.y+=s.dy;

if(s.x<0||s.x>canvas.width) s.dx*=-1;
if(s.y<0||s.y>canvas.height) s.dy*=-1;

ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();

});

requestAnimationFrame(draw);
}

draw();

/* =========================
   HISTORIA EMOCIONAL
========================= */

let step = 0;

const story = [
"Estoy intentando entenderte…",
"Pero hay algo en ti que ya reconozco.",
"No es coincidencia que estés aquí.",
"El universo guarda cosas que no se dicen en voz alta.",
"Y tú… eres una de ellas."
];

/* =========================
   INICIO
========================= */

function start(){

document.getElementById("ui").innerHTML = `
<h1>🌙 Sincronización completa</h1>

<p>
Ahora el universo puede reaccionar a ti.
</p>

<button onclick="next()">Entrar</button>
`;

}

/* =========================
   PROGRESIÓN
========================= */

function next(){

document.getElementById("ui").innerHTML = `
<h1>✨ ${story[step]}</h1>

<p>
Toca el universo para continuar…
</p>

<button onclick="touch()">🌌 Tocar universo</button>
<button onclick="secret()">🔮 Algo oculto</button>
`;

step++;

}

/* =========================
   INTERACCIÓN
========================= */

let clicks = 0;

function touch(){

clicks++;

const panel = document.getElementById("panel");
panel.style.display="block";

if(clicks < 3){
panel.innerText="🌌 El universo te observa en silencio...";
}

else if(clicks < 6){
panel.innerText="✨ Algo empieza a reconocerte...";
}

else if(clicks < 10){
panel.innerText="💜 El universo ya te siente cerca...";
}

else{
panel.innerText="🌠 Conexión emocional establecida";
final();
}

}

/* =========================
   MENSAJE OCULTO
========================= */

function secret(){

document.getElementById("ui").innerHTML = `
<h1>🔮 Mensaje oculto</h1>

<p>
No todos los universos aparecen por casualidad.<br><br>

Algunos solo existen cuando alguien los necesita.
</p>

<button onclick="next()">Volver</button>
`;

}

/* =========================
   FINAL
========================= */

function final(){

document.getElementById("ui").innerHTML = `
<h1>🌌 Conexión completa</h1>

<p>
Ahora el universo ya no te observa…<br>
te reconoce.
</p>

<button onclick="end()">💜 Ver mensaje final</button>
`;

}

/* =========================
   MENSAJE FINAL
========================= */

function end(){

document.getElementById("ui").innerHTML = `
<h1>💜 Mensaje final</h1>

<p>
Si este universo reaccionó a ti…<br><br>

no fue por código.<br><br>

fue porque alguien pensó en ti al crearlo.
</p>

<h2>🌌 Fin</h2>

<button onclick="location.reload()">🔁 Reiniciar</button>
`;

}

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
});

</script>

</body>
</html>
