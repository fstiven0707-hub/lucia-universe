<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌈 Cosmic Pastel Universe</title>

<style>

/* =========================
   FONDO PASTEL ANIMADO
========================= */

body{
margin:0;
font-family:'Segoe UI', sans-serif;
overflow:hidden;
color:#fff;
background: linear-gradient(-45deg,
#ffb6ff,
#7afcff,
#ffd6a5,
#caffbf,
#bdb2ff
);
background-size:400% 400%;
animation:gradient 12s ease infinite;
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* =========================
   PARTÍCULAS SUAVES
========================= */

.particle{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
background:white;
opacity:.5;
animation:float 6s infinite ease-in-out;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-20px);}
}

/* =========================
   UI PRINCIPAL
========================= */

.ui{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
backdrop-filter:blur(2px);
}

h1{
font-size:3rem;
text-shadow:0 0 20px rgba(255,255,255,.4);
}

p{
max-width:600px;
opacity:.85;
}

/* =========================
   BOTONES MULTICOLOR
========================= */

button{
margin:8px;
padding:12px 18px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:14px;
color:white;
transition:.3s;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

button:hover{
transform:scale(1.05);
}

/* colores botones */

.pink{background:#ff7eb9;}
.blue{background:#7afcff;}
.purple{background:#b388ff;}
.green{background:#caffbf;}
.yellow{background:#ffd6a5;}
.red{background:#ff6b6b;}

/* =========================
   PANEL
========================= */

#panel{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:12px 20px;
border-radius:15px;
background:rgba(255,255,255,.25);
backdrop-filter:blur(10px);
color:#000;
display:none;
}

/* =========================
   GRID BOTONES
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
margin-top:20px;
width:90%;
max-width:800px;
}

.card{
background:rgba(255,255,255,.25);
padding:20px;
border-radius:18px;
backdrop-filter:blur(10px);
color:#000;
}

</style>

</head>

<body>

<div class="ui">

<h1>🌈 Cosmic Pastel Universe</h1>

<p>Un universo interactivo lleno de colores, secretos y sorpresas ✨</p>

<!-- BOTONES PRINCIPALES -->
<div>

<button class="pink" onclick="msg()">💌 Mensaje</button>
<button class="blue" onclick="question()">🌠 Pregunta</button>
<button class="purple" onclick="oracle()">🔮 Oráculo</button>

</div>

<!-- GRID INTERACTIVO -->
<div class="grid">

<div class="card">
<h3>⭐ Estrellas</h3>
<button class="yellow" onclick="star()">Aumentar</button>
</div>

<div class="card">
<h3>🌷 Jardín</h3>
<button class="green" onclick="flower()">Plantar</button>
</div>

<div class="card">
<h3>🐱 Mascota</h3>
<button class="pink" onclick="pet()">Interactuar</button>
</div>

<div class="card">
<h3>🎁 Cofre</h3>
<button class="red" onclick="chest()">Abrir</button>
</div>

<div class="card">
<h3>🎡 Ruleta</h3>
<button class="blue" onclick="roulette()">Girar</button>
</div>

<div class="card">
<h3>📖 Diario</h3>
<button class="purple" onclick="diary()">Guardar</button>
</div>

</div>

</div>

<!-- PANEL -->
<div id="panel"></div>

<script>

/* =========================
   DATOS
========================= */

const messages=[
"✨ Eres más importante de lo que crees",
"🌈 Todo fluye como debe ser",
"💜 Hoy es un buen día para ti"
];

const questions=[
"¿Qué te haría feliz ahora?",
"¿Qué sueñas lograr?",
"¿Qué te inspira?"
];

const oracle=[
"🔮 Algo bonito viene",
"🌙 Confía en el proceso",
"⭐ Estás creciendo"
];

const pets=[
"😺 La mascota sonríe",
"🐱 Quiere jugar contigo",
"💜 Te aprecia mucho"
];

const chest=[
"🎁 Energía positiva",
"⭐ Estrella brillante",
"🌷 Suerte suave"
];

const roulette=[
"🌙 Descansar",
"🌈 Crear algo",
"💜 Sonreír",
"⭐ Soñar"
];

/* =========================
   FUNCIONES
========================= */

function show(text){
let p=document.getElementById("panel");
p.style.display="block";
p.innerText=text;
setTimeout(()=>p.style.display="none",2500);
}

function msg(){
show(messages[Math.floor(Math.random()*messages.length)]);
}

function question(){
show(questions[Math.floor(Math.random()*questions.length)]);
}

function oracle(){
show(oracle[Math.floor(Math.random()*oracle.length)]);
}

function pet(){
show(pets[Math.floor(Math.random()*pets.length)]);
}

function chest(){
show(chest[Math.floor(Math.random()*chest.length)]);
}

function roulette(){
show(roulette[Math.floor(Math.random()*roulette.length)]);
}

function star(){
show("⭐ Estrella añadida al universo");
}

function flower(){
show("🌷 Flor plantada");
}

function diary(){
show("📖 Guardado en el universo");
}

/* =========================
   PARTÍCULAS
========================= */

for(let i=0;i<60;i++){
let d=document.createElement("div");
d.className="particle";
d.style.left=Math.random()*100+"%";
d.style.top=Math.random()*100+"%";
d.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(d);
}

</script>

</body>
</html>
