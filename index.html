<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌌 Cosmic Universe Experience</title>

<style>

/* =========================
   BASE CINEMÁTICA SUAVE
========================= */

body{
margin:0;
overflow:hidden;
font-family:Segoe UI;
background: radial-gradient(circle at top,#050816,#070b18,#02030a);
color:white;
}

/* CANVAS UNIVERSO */
canvas{
position:fixed;
top:0;
left:0;
}

/* =========================
   UI FLUIDA
========================= */

.ui{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:10;
padding:20px;
}

h1{
font-size:3rem;
opacity:.9;
}

p{
max-width:600px;
opacity:.7;
}

/* BOTÓN PREMIUM */
button{
margin-top:20px;
padding:12px 20px;
border-radius:12px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.05);
color:white;
cursor:pointer;
transition:.3s;
backdrop-filter:blur(10px);
}

button:hover{
transform:scale(1.05);
background:rgba(255,255,255,.1);
}

/* PANEL */
.panel{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,.05);
padding:15px 25px;
border-radius:15px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.1);
display:none;
}

</style>

</head>

<body>

<canvas id="space"></canvas>

<div class="ui" id="ui">

<h1>🌌 Universo para ti</h1>

<p id="text">
Este universo reacciona a ti... ¿quieres explorarlo?
</p>

<button onclick="start()">🚀 Iniciar experiencia</button>

</div>

<div class="panel" id="panel"></div>

<script>

/* =========================
   CANVAS UNIVERSO REAL
========================= */

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

for(let i=0;i<120;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
dx:(Math.random()-0.5)*0.3,
dy:(Math.random()-0.5)*0.3
});
}

function animate(){
ctx.fillStyle="rgba(0,0,0,0.4)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

particles.forEach(p=>{
p.x += p.dx;
p.y += p.dy;

if(p.x<0||p.x>canvas.width) p.dx*=-1;
if(p.y<0||p.y>canvas.height) p.dy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
});

requestAnimationFrame(animate);
}

animate();

/* =========================
   EXPERIENCIA EMOCIONAL
========================= */

let stage = 0;

const texts = [
"Este universo siente tu presencia 🌌",
"Cada estrella reacciona a tu energía ✨",
"No estás solo en este espacio...",
"Algo está cambiando lentamente...",
"El universo quiere decirte algo..."
];

function start(){
document.getElementById("ui").innerHTML=`
<h1>🌙 Conectando...</h1>
<p>Respira... esto es solo para ti</p>
<button onclick="next()">Continuar</button>
`;
}

function next(){

let ui = document.getElementById("ui");

ui.innerHTML=`
<h1>✨ ${texts[stage]}</h1>
<p>Interactúa con el universo</p>

<button onclick="clickUniverse()">Tocar universo</button>
<button onclick="reveal()">Abrir mensaje oculto</button>
`;

stage++;
}

/* =========================
   INTERACCIÓN PRINCIPAL
========================= */

let clicks = 0;

function clickUniverse(){

clicks++;

let panel = document.getElementById("panel");
panel.style.display="block";

if(clicks < 3){
panel.innerText = "🌌 El universo te observa...";
}

if(clicks >= 3 && clicks < 6){
panel.innerText = "✨ Algo está respondiendo a ti...";
}

if(clicks >= 6){
panel.innerText = "💫 El universo te reconoce";
unlockFinal();
}

}

/* =========================
   FINAL SECRETO
========================= */

function unlockFinal(){

document.getElementById("ui").innerHTML=`
<h1>🌌 Conexión establecida</h1>
<p>El universo entendió tu presencia.</p>

<button onclick="message()">💌 Ver mensaje final</button>
`;

}

function message(){

document.getElementById("ui").innerHTML=`
<h1>💜 Mensaje final</h1>

<p>
No importa dónde estés,<br>
siempre habrá un universo observándote con calma.<br><br>

✨ Y este fue creado solo para ti.
</p>

<h2>🌌 Fin de la experiencia</h2>
`;

}

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
});

</script>

</body>
</html>
